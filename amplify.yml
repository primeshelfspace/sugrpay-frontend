            - (cd ../.. && pnpm --filter "./packages/*" build)
        build:
          commands:
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
  - appRoot: apps/payment
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
