# nginx server blocks for the three web apps. Install as described in
# deploy/README.md, then run certbot, which adds the HTTPS listeners, the
# certificates and the HTTP -> HTTPS redirects to this file.
#
# The API's server block lives in platform/deploy/nginx/api.conf.

# Every block forwards X-Forwarded-Proto: the apps read it to decide whether the
# session cookie is Secure and whether the payment page's CSP upgrades insecure
# requests. This map passes WebSocket upgrades through and keeps plain requests
# on ordinary keep-alive connections.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Accounts: sign-in, team, brands, locations, billing.
server {
    listen 80;
    listen [::]:80;
    server_name accounts.primeshelfspace.com;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Sugrpay admin.
server {
    listen 80;
    listen [::]:80;
    server_name sugrpay.primeshelfspace.com;

    # Brand logo uploads go through a server action capped at 6 MB
    # (serverActions.bodySizeLimit in apps/invoicing/next.config).
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Public payment pages. Check images are uploaded from the browser straight to
# the API, so nothing large passes through here.
server {
    listen 80;
    listen [::]:80;
    server_name pay.primeshelfspace.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
