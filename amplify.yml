# AWS Amplify build settings: one entry per web app in this monorepo.
# Each app is its own Amplify app pointing at this repository, with
# "My app is a monorepo" ticked and its app root set to the appRoot below.
# Together they are served as ONE site: see deploy/amplify.md.
version: 1
applications:
  - appRoot: apps/invoicing
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - corepack enable && corepack prepare pnpm@11.10.0 --activate
            - (cd ../.. && CI=true pnpm install --frozen-lockfile)
            - (cd ../.. && pnpm --filter "./packages/*" build)
        build:
          commands:
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
  - appRoot: apps/accounts
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - corepack enable && corepack prepare pnpm@11.10.0 --activate
