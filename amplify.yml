# AWS Amplify build settings for the Sugrpay web app (apps/sugrpay).
# The Amplify app needs the environment variable
#   AMPLIFY_MONOREPO_APP_ROOT=apps/sugrpay
# because the shared packages/ sit beside the app in this repository.
# See deploy/amplify.md.
version: 1
applications:
  - appRoot: apps/sugrpay
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - corepack enable && corepack prepare pnpm@11.10.0 --activate
            - (cd ../.. && CI=true pnpm install --frozen-lockfile)
            - (cd ../.. && pnpm --filter "./packages/*" build)
        build:
          commands:
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
