# nginx server block for the Sugrpay web app, when it runs on a server rather
# than Amplify. One address serves everything:
#   /            Sugrpay admin
#   /accounts/…  sign-in, sign-up, team, brands, billing
#   /pay/…       public payment pages
# Install it, then run certbot, which adds the HTTPS listener, the certificate
# and the HTTP -> HTTPS redirect to this file.
#
# The API's server block lives in platform/deploy/nginx/api.conf.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.primeshelfspace.com;

    # Brand logo uploads go through a server action capped at 6 MB
    # (serverActions.bodySizeLimit in apps/sugrpay/next.config.mjs).
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The app reads this to decide whether the session cookie is Secure and
        # whether the /pay pages' CSP upgrades insecure requests.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
